  <title>Tija</title>
  <meta name="description" content="Tija: a minimal yet powerful productivity app with an offline-first approach.">
  <style>
    :root { --bg: #ffffff; --fg: #1c1b1f; --muted: #5f5c66; --accent: #6750a4; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141218; --fg: #e6e0e9; --muted: #aca6b4; --accent: #cfbcff; }
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 680px; margin: 0 auto; padding: 40px 16px 64px; }
    h1 { font-size: 1.9rem; margin: 0 0 8px; }
    p { color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Tija</h1>
    <p>A minimal yet powerful productivity app with an offline-first approach.</p>
    <ul>
